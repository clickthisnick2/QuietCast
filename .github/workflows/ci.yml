name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4.3-jammy
    steps:
      - name: Install check tools
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git make python3 python3-pip ca-certificates curl
          pip3 install --no-cache-dir 'codespell==2.2.6'
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check
        run: make check
